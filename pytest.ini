[pytest]
# pytest 8 stats every entry in the root dir during collection. The Claude Code
# Bash sandbox denies stat() on .env.local, so collection died with
# PermissionError before any test ran. Skipping .env* avoids the stat.
#
# e2e tests spawn a real airship.py subprocess and take real wall-clock time
# (uv resolving deps, a real TLS handshake, polling for readiness), so the
# default run excludes them. Run them explicitly with `-m e2e` (needs
# --with httpx; see README's Development section).
addopts = --ignore-glob=.env* -m "not e2e"
markers =
    e2e: end-to-end tests that spawn a real airship.py subprocess over real HTTPS (excluded by default; run with -m e2e)
